name: JioTV Playlist Update

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: playlist-update
  cancel-in-progress: true

permissions:
  contents: write

env:
  SOURCE_URL: "https://premiumplugx.top/jiostb/mjelo.php?view=raw"
  OUTPUT_FILE: "alaxl.m3u"

jobs:
  update-playlist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Source Playlist
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 5 \
            --connect-timeout 15 \
            --max-time 120 \
            "$SOURCE_URL" \
            -o "$OUTPUT_FILE"
          test -s "$OUTPUT_FILE"
          echo "✅ Source downloaded successfully."

      - name: Verify Output
        run: |
          test -s "$OUTPUT_FILE"
          grep -q "^#EXTM3U" "$OUTPUT_FILE"
          grep -q "#EXTINF" "$OUTPUT_FILE"
          echo "✅ Output playlist is valid and contains channels."

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # റിമോട്ട് റെപ്പോയിലെ പുതിയ മാറ്റങ്ങൾ ആദ്യം ലഭ്യമാക്കുക
          git pull --rebase origin main || true
          
          git add "$OUTPUT_FILE"
          if git diff --staged --quiet; then
            echo "No changes detected."
            exit 0
          fi
          
          git commit -m "chore: update playlist complete data"
          
          # കോൺഫ്ലിക്റ്റ് ഒഴിവാക്കി സുരക്ഷിതമായി പുഷ് ചെയ്യുക
          git pull --rebase origin main
          git push origin main
