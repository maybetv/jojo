name: Extract M3U Channels

on:
  schedule:
    # ഓരോ 10 മിനിറ്റ് കൂടുമ്പോഴും റൺ ചെയ്യാൻ
    - cron: '*/10 * * * *'
  workflow_dispatch: # മാനുവലായി റൺ ചെയ്യാൻ

permissions:
  contents: write # ഫയൽ commit ചെയ്ത് push ചെയ്യാനുള്ള അനുമതി

jobs:
  filter-m3u:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Download and Filter Channels
        run: |
          python - << 'EOF'
          import requests

          url = "https://server.lrl45.workers.dev/channel/raw?=m3u"
          output_file = "bm.m3u"

          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"
          }

          try:
              print(f"Downloading M3U playlist from: {url}")
              response = requests.get(url, headers=headers, timeout=60)
              response.raise_for_status()
              content = response.text
          except Exception as e:
              print(f"Error fetching playlist: {e}")
              exit(1)

          lines = content.splitlines()
          extracted_items = []
          
          i = 0
          while i < len(lines):
              line = lines[i].strip()
              if line.startswith("#EXTINF"):
                  info_line = line
                  url_line = ""
                  
                  # ചാനൽ ടാഗുകളും ലിങ്കും കണ്ടെത്തുന്നു
                  j = i + 1
                  extra_tags = []
                  while j < len(lines):
                      next_line = lines[j].strip()
                      if not next_line:
                          j += 1
                          continue
                      if next_line.startswith("#EXTVLCOPT") or next_line.startswith("#EXTGRP"):
                          extra_tags.append(next_line)
                          j += 1
                      elif not next_line.startswith("#"):
                          url_line = next_line
                          break
                      else:
                          break

                  lower_info = info_line.lower()
                  
                  # ബിബിസി മലയാളം / മലയാളം ഫിൽട്ടർ ചെയ്യുന്നു
                  if "malayalam" in lower_info or "bbc" in lower_info:
                      extracted_items.append(info_line)
                      for tag in extra_tags:
                          extracted_items.append(tag)
                      if url_line:
                          extracted_items.append(url_line)

                  i = j
              else:
                  i += 1

          if extracted_items:
              with open(output_file, "w", encoding="utf-8") as f:
                  f.write("#EXTM3U\n")
                  for item in extracted_items:
                      f.write(item + "\n")
              print(f"Success! {len(extracted_items)} items written to {output_file}")
          else:
              print("No matching channels found.")
          EOF

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add bm.m3u
          if git status --porcelain | grep -q 'bm.m3u'; then
            git commit -m "Auto-update bm.m3u playlist [skip ci]"
            git push
          else
            echo "No changes to commit."
          fi

