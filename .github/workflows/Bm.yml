name: Extract Bigg Boss Malayalam Hotstar Stream

on:
  schedule:
    # ഓരോ 10 മിനിറ്റിലും റൺ ചെയ്യാൻ
    - cron: '*/10 * * * *'
  workflow_dispatch: # മാനുവലായി റൺ ചെയ്യാൻ

permissions:
  contents: write # GitHub-ലേക്ക് ഫയൽ പുഷ് ചെയ്യാനുള്ള അനുമതി

jobs:
  filter-m3u:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Extract Bigg Boss Malayalam Channels
        run: |
          python - << 'EOF'
          import requests
          import re

          url = "https://server.lrl45.workers.dev/channel/raw?=m3u"
          output_file = "bm.m3u"

          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
          }

          try:
              print(f"Downloading source M3U from: {url}")
              response = requests.get(url, headers=headers, timeout=60)
              response.raise_for_status()
              content = response.text
          except Exception as e:
              print(f"Error fetching playlist: {e}")
              exit(1)

          lines = content.splitlines()
          all_blocks = []
          current_block = []

          # ഓരോ ചാനലിന്റെയും സമ്പൂർണ്ണ ബ്ലോക്ക് (Tags + KodiProps + Headers + Stream URL) വേർതിരിക്കുന്നു
          for line in lines:
              stripped = line.strip()
              if not stripped:
                  continue
              
              if stripped.startswith("#EXTINF"):
                  if current_block:
                      all_blocks.append(current_block)
                  current_block = [stripped]
              elif current_block:
                  current_block.append(stripped)

          if current_block:
              all_blocks.append(current_block)

          print(f"Total channel blocks found: {len(all_blocks)}")

          # Step 1: ആദ്യം Hotstar അടങ്ങിയ ബ്ലോക്കുകൾ മാത്രം കണ്ടെത്തുന്നു
          hotstar_blocks = []
          for block in all_blocks:
              block_content = "\n".join(block).lower()
              if "hotstar" in block_content:
                  hotstar_blocks.append(block)

          print(f"Hotstar channels found: {len(hotstar_blocks)}")

          # Step 2: Hotstar ലിങ്കുകളിൽ നിന്ന് 'Bigg Boss Malayalam' മാത്രം ഫിൽട്ടർ ചെയ്യുന്നു
          final_blocks = []
          for block in hotstar_blocks:
              # ചാനൽ ടൈറ്റിലും വിവരങ്ങളും അടങ്ങിയ ഭാഗം
              block_content = "\n".join(block).lower()
              
              # 'bigg boss' ഉം 'malayalam' ഉം ഒരുമിച്ചുണ്ടോ, അല്ലെങ്കിൽ 'bb malayalam' ഉണ്ടോ എന്ന് പരിശോധിക്കുന്നു
              is_bigg_boss = ("bigg boss" in block_content) or ("biggboss" in block_content) or ("bb malayalam" in block_content) or ("bbm" in block_content)
              is_malayalam = ("malayalam" in block_content) or ("asianet" in block_content)

              if is_bigg_boss and is_malayalam:
                  final_blocks.append(block)

          if final_blocks:
              with open(output_file, "w", encoding="utf-8") as f:
                  f.write("#EXTM3U\n")
                  for block in final_blocks:
                      for item in block:
                          f.write(item + "\n")
              print(f"Success! {len(final_blocks)} Bigg Boss Malayalam stream(s) written to {output_file}")
          else:
              print("No matching Bigg Boss Malayalam stream found under Hotstar.")
          EOF

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add bm.m3u
          if git status --porcelain | grep -q 'bm.m3u'; then
            git commit -m "Auto-update Bigg Boss Malayalam stream [skip ci]"
            git push
          else
            echo "No changes to commit (playlist is up to date)."
          fi
