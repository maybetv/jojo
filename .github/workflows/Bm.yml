name: Extract Full Hotstar Streams with DRM & Headers

on:
  schedule:
    # ഓരോ 10 മിനിറ്റിലും റൺ ചെയ്യാൻ
    - cron: '*/10 * * * *'
  workflow_dispatch: # മാനുവലായി റൺ ചെയ്യാൻ

permissions:
  contents: write # GitHub-ലേക്ക് ഫയൽ സേവ് ചെയ്യാനുള്ള അനുമതി

jobs:
  filter-m3u:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Extract Channels with Complete Headers & Props
        run: |
          python - << 'EOF'
          import requests

          url = "https://server.lrl45.workers.dev/channel/raw?=m3u"
          output_file = "bm.m3u"

          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
          }

          try:
              print(f"Downloading source M3U from: {url}")
              response = requests.get(url, headers=headers, timeout=60)
              response.raise_for_status()
              content = response.text
          except Exception as e:
              print(f"Error fetching playlist: {e}")
              exit(1)

          lines = content.splitlines()
          all_blocks = []
          current_block = []

          # ഓരോ ചാനലിന്റെയും സമ്പൂർണ്ണ ബ്ലോക്ക് (Tags + KodiProps + URL) വേർതിരിക്കുന്നു
          for line in lines:
              stripped = line.strip()
              if not stripped:
                  continue
              
              # പുതിയ ചാനൽ എൻട്രി തുടങ്ങുമ്പോൾ പഴയത് സേവ് ചെയ്യുന്നു
              if stripped.startswith("#EXTINF"):
                  if current_block:
                      all_blocks.append(current_block)
                  current_block = [stripped]
              elif current_block:
                  current_block.append(stripped)

          if current_block:
              all_blocks.append(current_block)

          # Hotstar അടങ്ങിയ ബ്ലോക്കുകൾ മാത്രം ഫിൽട്ടർ ചെയ്യുന്നു
          extracted_blocks = []
          for block in all_blocks:
              block_text = "\n".join(block).lower()
              if "hotstar" in block_text:
                  extracted_blocks.append(block)

          if extracted_blocks:
              with open(output_file, "w", encoding="utf-8") as f:
                  f.write("#EXTM3U\n")
                  for block in extracted_blocks:
                      for item in block:
                          f.write(item + "\n")
              print(f"Success! {len(extracted_blocks)} complete Hotstar channel blocks extracted to {output_file}")
          else:
              print("No matching Hotstar streams found.")
          EOF

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add bm.m3u
          if git status --porcelain | grep -q 'bm.m3u'; then
            git commit -m "Auto-update complete Hotstar channels [skip ci]"
            git push
          else
            echo "No changes to commit."
          fi
