name: Sync Ser

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: sync-ser
  cancel-in-progress: false

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'Ser.m3u'
      - 'New_Codes.m3u'

jobs:
  update_jojo:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Download Original Playlist
        run: curl -L "https://game.playindia.fun/Jtv/RiYlIZ/Playlist.m3u" -o Ser.m3u

      - name: Extract Links and Create New Playlist
        shell: python
        run: |
          import re
          input_file = "Ser.m3u"
          output_file = "New_Codes.m3u"
          try:
              with open(input_file, "r", encoding="utf-8") as f:
                  lines = f.readlines()
          except FileNotFoundError:
              print(f"Error: {input_file} not found.")
              exit(0)
          new_playlist = ["#EXTM3U\n"]
          current_info = ""
          for line in lines:
              line = line.strip()
              if not line:
                  continue
              
              if line.startswith("#EXTINF"):
                  current_info = line
              elif line.startswith("http://") or line.startswith("https://"):
                  original_link = line
                  custom_code_link = f"{original_link}" 
                  if current_info:
                      new_playlist.append(f"{current_info}\n")
                  new_playlist.append(f"{custom_code_link}\n")
                  current_info = ""
              elif line.startswith("#EXTM3U"):
                  continue
              else:
                  if current_info:
                      new_playlist.append(f"{line}\n")
          with open(output_file, "w", encoding="utf-8") as f:
              f.writelines(new_playlist)
          print(f"Successfully generated {output_file} with extracted links.")

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add Ser.m3u New_Codes.m3u
          
          if ! git diff --cached --quiet; then
            git commit -m "chore: update playlists and extract new codes"
            
            for i in {1..3}; do
              if git pull origin main --rebase && git push origin main; then
                echo "Successfully pushed changes."
                exit 0
              fi
              echo "Push rejected, retrying in 3 seconds (attempt $i/3)..."
              sleep 3
            done
            
            echo "Failed to push changes after 3 attempts."
            exit 1
          else
            echo "No updates to sync."
          fi
