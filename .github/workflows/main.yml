name: Sync Jojo File from External Link

on:
  schedule:
    # ഓരോ 30 മിനിറ്റിലും റൺ ചെയ്യാൻ
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main

# ഒരേ സമയം രണ്ട് പ്രാവശ്യം റൺ ആയി കോൺഫ്ലിക്റ്റ് ഉണ്ടാകുന്നത് തടയാൻ
concurrency:
  group: sync-jojo-file
  cancel-in-progress: true

jobs:
  update_jojo:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Extract Complete Playlist Data (with DRM, Headers & Tags)
        shell: python
        run: |
          import sys
          import urllib.request

          SOURCE_URL = "https://game.playindia.fun/Jtv/RiYlIZ/Playlist.m3u"
          OUTPUT_FILE = "Jojo.m3u"

          # ഒറിജിനൽ പ്ലേലിസ്റ്റ് സെർവറിൽ നിന്ന് മുഴുവൻ ഡാറ്റയും ബ്ലോക്കാവാതെ എടുക്കാനുള്ള ഹെഡറുകൾ
          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36",
              "Accept": "*/*"
          }

          print(f"Connecting and extracting from: {SOURCE_URL}")
          req = urllib.request.Request(SOURCE_URL, headers=headers)

          try:
              with urllib.request.urlopen(req, timeout=60) as response:
                  raw_content = response.read().decode("utf-8", errors="ignore")

              lines = raw_content.splitlines()

              if not lines:
                  print("Error: Empty response received from source!")
                  sys.exit(1)

              extracted_lines = []
              has_extm3u = False

              for line in lines:
                  cleaned = line.strip()
                  if not cleaned:
                      continue

                  # #EXTM3U ഹെഡർ ട്രാക്ക് ചെയ്യുന്നു
                  if cleaned.startswith("#EXTM3U"):
                      if not has_extm3u:
                          extracted_lines.append(cleaned)
                          has_extm3u = True
                      continue

                  # #KODIPROP (ClearKey/Widevine/License), #EXTHTTP, #EXTVLCOPT, #EXTINF, URLs
                  # അടക്കം ഒരു ഡാറ്റയും വിട്ടുപോകാതെ മുഴുവനായി ചേർക്കുന്നു
                  extracted_lines.append(cleaned)

              if not has_extm3u:
                  extracted_lines.insert(0, "#EXTM3U")

              # Jojo.m3u ഫയലിലേക്ക് പൂർണ്ണമായി എഴുതുന്നു
              with open(OUTPUT_FILE, "w", encoding="utf-8") as f:
                  f.write("\n".join(extracted_lines) + "\n")

              print(f"Successfully processed {len(extracted_lines)} lines into {OUTPUT_FILE}")

          except Exception as e:
              print(f"Failed to fetch and extract: {e}")
              sys.exit(1)

      - name: Commit and Push Changes Safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Jojo.m3u

          # ഫയലിൽ പുതിയ അപ്ഡേറ്റുകൾ ഉണ്ടെങ്കിൽ മാത്രം പുഷ് ചെയ്യുക
          if ! git diff --cached --quiet; then
            git commit -m "chore: full sync Jojo.m3u with DRM and headers [skip ci]"
            
            # മുൻപത്തെ റണ്ണിലെ കോൺഫ്ലിക്റ്റുകൾ വരാതിരിക്കാൻ സുരക്ഷിതമായി പുഷ് ചെയ്യുന്നു
            git push origin main
          else
            echo "No updates detected. Jojo.m3u is already up-to-date."
          fi
