name: Sync Jojo File from External Link

# Global environment setting to suppress and force Node 24
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main

# Prevent concurrent runs from overlapping and causing push conflicts
concurrency:
  group: sync-jojo-file
  cancel-in-progress: true

jobs:
  update_jojo:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4.2.2

      - name: Download Updated File
        run: curl -L "https://game.playindia.fun/Jtv/RiYlIZ/Playlist.m3u" -o Jojo.m3u

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add Jojo.m3u
          
          # Only proceed if changes are detected
          if ! git diff --cached --quiet; then
            git commit -m "chore: update Jojo.m3u from external source"
            
            # Fetch and rebase latest remote changes before pushing
            git pull --rebase origin main
            
            git push origin main
          else
            echo "No updates to sync."
          fi
