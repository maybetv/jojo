name: Update M3U Playlist

on:
  schedule:
    # Runs automatically every 12 hours (00:00 and 12:00 UTC)
    - cron: '0 0,12 * * *'
  # Allows manual triggering from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download M3U playlist
        run: |
          curl -s -L -A "Mozilla/5.0" \
            "http://skyfilex.fun/get.php?username=AnKit3803&password=3803AnkIT&type=m3u_plus" \
            -o hos.m3u

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add hos.m3u
          
          # Only commit if changes exist
          if git diff --staged --quiet; then
            echo "No changes detected in hos.m3u"
          else
            git commit -m "Auto-update hos.m3u playlist [skip ci]"
            git push
          fi
